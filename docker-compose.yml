services:
  db:
    image: postgres:15-alpine
    container_name: bolsa_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bolsa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bolsa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/bolsa_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
